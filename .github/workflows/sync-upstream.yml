name: Upstream Sync

on:
  schedule:
    - cron: '0 0 * * *' # 每天 UTC 00:00 (北京时间 08:00) 自动同步
  workflow_dispatch: # 支持在 GitHub Actions 页面手动点击触发

permissions:
  contents: write

jobs:
  sync:
    name: Sync with Upstream
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Sync upstream changes
        run: |
          git remote add upstream https://github.com/pingdotgg/t3code.git || git remote set-url upstream https://github.com/pingdotgg/t3code.git
          git fetch upstream main
          git checkout main
          # 合并上游 main 分支改动，并添加 [skip ci] 避免消耗大量构建配额
          git merge upstream/main -m "chore: sync with upstream [skip ci]" --allow-unrelated-histories || (echo "Merge conflict detected! Please resolve conflicts manually." && exit 1)
          git push origin main
