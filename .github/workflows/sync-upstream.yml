name: Upstream Sync

on:
  schedule:
    # 每 6 小时同步一次，避开整点 0 分的 GitHub Actions 调度高峰
    - cron: '17 */6 * * *'
  workflow_dispatch: # 支持在 GitHub Actions 页面手动点击触发

permissions:
  contents: write

concurrency:
  group: upstream-sync
  cancel-in-progress: false

jobs:
  sync:
    name: Sync with Upstream
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        env:
          CLONE_TOKEN: ${{ github.token }}
        run: |
          # 直接用 git init + fetch，避免 actions/checkout 清理凭据时触发 .repos 中无 .gitmodules URL 的子模块报错，
          # 且不将任何 token 持久化写入 .git/config。
          git init -b main
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          auth_b64="$(printf 'x-access-token:%s' "$CLONE_TOKEN" | base64 | tr -d '\r\n')"
          echo "::add-mask::${auth_b64}"

          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${auth_b64}" \
            fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          git checkout -B main origin/main

      - name: Fetch upstream
        id: upstream
        run: |
          # 用 get-url 判断，避免 remote 已存在时 git remote add 产生一次失败日志。
          if git remote get-url upstream >/dev/null 2>&1; then
            git remote set-url upstream https://github.com/pingdotgg/t3code.git
          else
            git remote add upstream https://github.com/pingdotgg/t3code.git
          fi

          # 上游被删除、改名或网络不可达时跳过本次同步，而不是每天把工作流标红。
          # fork 是独立仓库，上游消失不影响本仓库的数据。
          if ! git ls-remote --exit-code --heads upstream main >/dev/null 2>&1; then
            echo "::warning::upstream/main is unreachable (deleted, renamed, or offline); skipping this sync."
            echo "available=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # 仅拉取上游 main 并显式更新 upstream/main，避免拉取无关分支和 tags。
          if ! git fetch --no-tags upstream +refs/heads/main:refs/remotes/upstream/main; then
            echo "::warning::git fetch upstream main failed; skipping this sync."
            echo "available=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "available=true" >> "$GITHUB_OUTPUT"

      - name: Sync upstream changes
        if: steps.upstream.outputs.available == 'true'
        env:
          PUSH_TOKEN: ${{ secrets.SYNC_PAT || github.token }}
          HAS_SYNC_PAT: ${{ secrets.SYNC_PAT != '' }}
        run: |
          git checkout main

          # 只接受与本地共享历史的上游分支。若 upstream/main 毫无共同祖先，
          # 说明该 URL 可能已被他人接管，宁可不合并，也不让无关历史进入 main。
          if ! git merge-base HEAD upstream/main >/dev/null 2>&1; then
            echo "::error::upstream/main shares no history with this fork; refusing to merge."
            exit 1
          fi

          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "Already up to date with upstream/main."
            exit 0
          fi

          # 使用 --no-ff 保证每次同步提交都带有 [skip ci]，避免使用 PAT 推送时误触发上游 CI。
          if ! git merge --no-ff upstream/main -m "chore: sync with upstream [skip ci]"; then
            echo "::error::Merge conflict detected! Please resolve conflicts manually."
            exit 1
          fi

          auth_b64="$(printf 'x-access-token:%s' "$PUSH_TOKEN" | base64 | tr -d '\r\n')"
          echo "::add-mask::${auth_b64}"

          if ! git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${auth_b64}" push origin main; then
            if [ "$HAS_SYNC_PAT" != "true" ]; then
              echo "::error::Push failed without secrets.SYNC_PAT. Upstream may have modified .github/workflows/; configure SYNC_PAT with Contents (write) and Workflows (write) permissions."
            fi
            exit 1
          fi
